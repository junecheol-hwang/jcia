<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shipia — 부분과 전체 · 배</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@300;400;500&family=Unbounded:wght@400;700&family=Bebas+Neue&family=Orbitron:wght@600&family=Nanum+Brush+Script&family=Playfair+Display:wght@600&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  /* ── shipia 3D 제1판 · bikia의 밤무대. 이번엔 원판 바닥이 바다가 된다 ── */
  :root{
    --ink:#0b0c0e; --paper:#e9e5dc; --paper-dim:#9a958b; --brass:#b99a5a; --rule:#2c3036; --panel:#16181c;
    --seal-jun:#cf6a55; --seal-jeon:#b99a5a; --seal-chu:#8fa3b8; --seal-mun:#9aa0ab;
    --serif:'Noto Serif KR','Apple SD Gothic Neo','Nanum Myeongjo',serif;
    --sans:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:radial-gradient(ellipse at 50% 45%, #232a34 0%, #14171c 55%, #0a0b0e 100%);color:var(--paper);font-family:var(--sans);font-weight:300;overflow:hidden}
  #stage{position:fixed;inset:0;cursor:grab}
  canvas{display:block}
  button{font-family:inherit}
  :focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important} }

  /* 상단 표제 — 해부도의 판 제목 */
  #title{position:fixed;left:28px;top:24px;z-index:6;pointer-events:none}
  #title h1{font-family:'Unbounded',var(--sans);font-weight:700;font-size:22px;letter-spacing:.02em;transform:scaleX(.86);transform-origin:left}
  #title p{font-size:12px;color:var(--paper-dim);margin-top:6px;letter-spacing:.06em}
  #edition{display:inline-block;margin-top:10px;padding:4px 9px;border:1px solid var(--brass);color:var(--brass);font-size:11px;letter-spacing:.08em;border-radius:2px}

  /* 선단 스위치 — 표제 아래 */
  #fleet{position:fixed;left:28px;top:118px;z-index:6;display:flex;flex-direction:column;gap:6px}
  #fleet .sec{font-size:11px;color:var(--paper-dim);letter-spacing:.14em;margin:6px 0 2px}
  .shipbtn{all:unset;cursor:pointer;display:flex;align-items:baseline;gap:9px;padding:6px 11px 6px 8px;font-size:13.5px;color:var(--paper);
    background:rgba(20,22,26,.85);border:1px solid #33373f;border-radius:3px;transition:border-color .2s,background .2s}
  .shipbtn i{width:14px;height:2px;background:#55595f;transform:translateY(-3px);transition:all .2s}
  .shipbtn small{color:var(--paper-dim);font-size:11px}
  .shipbtn:hover,.shipbtn.on{border-color:var(--brass);background:rgba(20,22,26,.97)}
  .shipbtn.on i{width:22px;background:var(--brass)}
  .shipbtn.wait{opacity:.42;cursor:default}
  .shipbtn.wait:hover{border-color:#33373f;background:rgba(20,22,26,.85)}

  /* 계통 범례 — 왼쪽 하단, 세로로 */
  #legend{position:fixed;left:28px;bottom:28px;z-index:6;display:flex;flex-direction:column;gap:6px}
  #legend .sec{font-size:11px;color:var(--paper-dim);letter-spacing:.14em;margin-bottom:2px}
  #legend button{all:unset;cursor:pointer;font-size:13px;font-weight:400;color:var(--paper);display:flex;align-items:center;gap:10px;
    padding:5px 12px 5px 8px;background:rgba(20,22,26,.85);border:1px solid #3a3e46;border-radius:3px;transition:all .2s}
  #legend button .cnt{color:var(--paper-dim);font-size:11px}
  #legend button i{width:18px;height:2px;background:#55595f;display:inline-block;transition:all .2s}
  #legend button.on,#legend button:hover{color:#fff;border-color:var(--brass);background:rgba(20,22,26,.97)}
  #legend button.on i{width:28px;background:var(--brass)}

  /* 낙인 HUD — 우상 */
  #hud{position:fixed;right:28px;top:28px;width:360px;z-index:6;background:rgba(18,20,24,.88);backdrop-filter:blur(8px);border:1px solid var(--rule);padding:13px 18px;font-variant-numeric:tabular-nums}
  #hud .h-ship{font-family:var(--serif);font-weight:600;font-size:16px}
  #hud .h-dim{font-size:12px;color:var(--paper-dim);margin-top:4px;line-height:1.7}
  #hud .h-stamp{font-size:11.5px;margin-top:6px;line-height:1.7}
  #hud .h-hover{font-size:12.5px;color:var(--brass);margin-top:8px;min-height:18px}
  #hud .h-tools{margin-top:8px;display:flex;gap:6px}
  #hud .h-tools button{all:unset;cursor:pointer;font-size:11px;color:var(--paper-dim);border:1px solid #3a3e46;border-radius:2px;padding:3px 8px}
  #hud .h-tools button.on,#hud .h-tools button:hover{color:var(--paper);border-color:var(--brass)}

  /* 이름표 — 3D 위에 뜨는 얇은 글씨 */
  #labels{position:fixed;inset:0;pointer-events:none;z-index:4}
  .lbl{position:absolute;transform:translate(-50%,-100%);font-size:11px;color:#cfcabf;background:rgba(12,13,16,.55);padding:2px 6px;border-radius:2px;white-space:nowrap;letter-spacing:.03em}
  .lbl::after{content:'';position:absolute;left:50%;bottom:-6px;width:1px;height:6px;background:#8a857b}

  /* 설명 패널 — 박물관 표찰 */
  #panel{position:fixed;right:28px;top:190px;bottom:28px;width:360px;z-index:7;background:var(--panel);border:1px solid var(--rule);
    display:flex;flex-direction:column;overflow:hidden;transform:translateX(12px);opacity:0;pointer-events:none;transition:transform .3s,opacity .3s}
  #panel.show{transform:none;opacity:1;pointer-events:auto}
  #ptabs{display:flex;border-bottom:1px solid var(--rule)}
  #ptabs button{all:unset;cursor:pointer;flex:1;text-align:center;padding:10px 0;font-size:12px;color:var(--paper-dim);border-bottom:2px solid transparent}
  #ptabs button.on{color:var(--paper);border-bottom-color:var(--brass)}
  #pclose{all:unset;cursor:pointer;padding:10px 12px;color:var(--paper-dim);font-size:13px}
  #pclose:hover{color:var(--paper)}
  #pbody{flex:1;overflow-y:auto;padding:16px 18px 20px;font-size:13.5px;line-height:1.75}
  #pfoot{padding:10px 16px;border-top:1px solid var(--rule);display:flex;align-items:center;gap:8px}
  #pfoot button{all:unset;cursor:pointer;font-size:12px;color:var(--paper);border:1px solid #3a3e46;border-radius:3px;padding:5px 10px}
  #pfoot button:hover{border-color:var(--brass)}
  #pfoot span{font-size:11px;color:var(--paper-dim);margin-left:auto}

  /* 표찰 안의 글 — v1 카드 문법 */
  .coord{font-size:11.5px;color:var(--paper-dim);letter-spacing:.05em;margin-bottom:8px}
  .card-title{font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.3}
  .card-term{font-size:12px;color:var(--brass);margin-top:4px}
  .prose{font-family:var(--serif);font-size:14px;line-height:1.85;margin-top:12px}
  .blocktitle{font-size:11.5px;color:var(--paper-dim);letter-spacing:.12em;margin:20px 0 6px}
  .col{background:rgba(18,20,24,.72);border:1px solid var(--rule);border-radius:3px;padding:11px 12px;margin-top:8px}
  .col h4{font-size:11.5px;color:var(--paper-dim);letter-spacing:.1em;font-weight:400;margin-bottom:7px}
  .col ul,.plainlist{list-style:none}
  .col li,.plainlist li{font-size:13px;line-height:1.7;margin-bottom:7px;padding-left:11px;position:relative}
  .col li::before,.plainlist li::before{content:'';position:absolute;left:0;top:.7em;width:5px;height:1px;background:var(--paper-dim)}
  .plainlist{margin-top:6px}
  .drawer{border:1px solid var(--rule);border-radius:3px;margin-top:8px;background:rgba(18,20,24,.6)}
  .drawer>.dhead{cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:9px 12px;font-size:13px;user-select:none}
  .drawer>.dhead .dchar{font-family:var(--serif);font-size:14px;color:var(--brass);margin-right:8px}
  .drawer>.dhead .arrow{color:var(--paper-dim);font-size:11px}
  .dbody{display:none;padding:2px 12px 11px;font-size:13px;line-height:1.75}
  .drawer.open .dbody{display:block}
  .dedit{all:unset;cursor:pointer;font-size:11px;color:var(--paper-dim);border:1px solid #3a3e46;border-radius:2px;padding:1px 6px;margin-left:7px}
  .dedit:hover{color:var(--paper);border-color:var(--brass)}
  textarea.raw{width:100%;min-height:100px;background:#101216;color:var(--paper);border:1px solid var(--brass);border-radius:3px;font-family:var(--sans);font-size:12.5px;line-height:1.7;padding:9px;resize:vertical}
  .verify{border-left:2px solid var(--brass);padding:9px 12px;margin-top:18px;background:rgba(185,154,90,.06);font-size:13px;line-height:1.75}
  .verify b{font-weight:500;color:var(--brass)}
  .doors li{color:var(--paper-dim)}
  .framecard{border:1px dashed #3a3e46;border-radius:3px;padding:13px 14px;margin-top:12px;color:var(--paper-dim);font-size:13px;line-height:1.7}
  .framecard b{color:var(--paper);font-family:var(--serif);font-weight:600;font-size:14px}
  .spec-row{display:flex;gap:10px;border-bottom:1px solid rgba(44,48,54,.7);padding:8px 2px;font-size:13px;line-height:1.7}
  .spec-row .k{flex:0 0 110px;color:var(--paper-dim)}
  .cardlink{all:unset;cursor:pointer;color:var(--brass);border-bottom:1px solid rgba(185,154,90,.4)}
  .cardlink:hover{border-bottom-color:var(--brass)}
  .src{display:flex;gap:10px;font-size:12.5px;line-height:1.65;padding:6px 4px;border-radius:3px;color:#cfcabf}
  .src .no{flex:none;color:var(--brass);font-variant-numeric:tabular-nums;width:20px;text-align:right}
  .src.hl{background:rgba(185,154,90,.14);outline:1px solid rgba(185,154,90,.5)}

  /* 도장 · 꼬리표 */
  .seal{display:inline-flex;align-items:center;cursor:pointer;font-family:var(--serif);font-size:11px;padding:0 5px;margin:0 2px;border-radius:2px;border:1px solid;transform:translateY(-1px);line-height:1.55;white-space:nowrap}
  .seal sup{font-size:9px;margin-left:2px}
  .seal.s準{color:var(--seal-jun);border-color:var(--seal-jun);background:rgba(207,106,85,.10)}
  .seal.s典{color:var(--seal-jeon);border-color:var(--seal-jeon);background:rgba(185,154,90,.10)}
  .seal.s推{color:var(--seal-chu);border-color:var(--seal-chu);background:rgba(143,163,184,.10)}
  .seal.s聞{color:var(--seal-mun);border-color:var(--seal-mun);background:rgba(154,160,171,.10)}
  .ptag{display:inline-block;font-size:10.5px;color:#c9c4b8;border:1px solid #4a4e56;border-radius:2px;padding:0 4px;margin:0 2px;transform:translateY(-1px)}
  .rtag{display:inline-block;font-size:10.5px;border-radius:2px;padding:1px 6px;margin-right:8px;border:1px solid}
  .rtag.keep{color:var(--paper-dim);border-color:#3a3e46}.rtag.mod{color:var(--brass);border-color:var(--brass)}.rtag.new{color:var(--seal-jun);border-color:var(--seal-jun)}
  #pop{position:fixed;z-index:50;max-width:300px;background:#101216;border:1px solid var(--brass);border-radius:3px;padding:10px 13px;font-size:12.5px;line-height:1.7;display:none;box-shadow:0 8px 30px rgba(0,0,0,.55)}
  #pop .pk{color:var(--brass);font-family:var(--serif);margin-right:6px}

  /* 튜닝 손잡이 · 계기판 */
  .trow{display:flex;align-items:center;gap:8px;margin:6px 0}
  .trow .tk{flex:0 0 78px;font-size:12px;color:var(--paper-dim)}
  .trow input[type=range]{flex:1;accent-color:var(--brass);min-width:0}
  .trow select{background:#101216;color:var(--paper);border:1px solid #3a3e46;border-radius:2px;font-size:12px;padding:2px 4px}
  .trow .tval{flex:0 0 66px;font-size:12px;text-align:right;font-variant-numeric:tabular-nums;color:var(--brass)}
  .tstats{margin-top:12px;border-top:1px solid var(--rule)}
  .tstats>div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px solid rgba(44,48,54,.7)}
  .tstats em{font-style:normal;font-size:11.5px;color:var(--paper-dim);line-height:1.5}
  .tstats b{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--paper);font-variant-numeric:tabular-nums;white-space:nowrap}
  .tstats .surplus b{color:var(--seal-chu)} .tstats .deficit b{color:var(--seal-jun)}
  .lbl.dyn{color:var(--paper);border:1px solid rgba(185,154,90,.55);background:rgba(12,13,16,.75)}
  .lbl.dyn::after{background:var(--brass)}
  .swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:6px}
  .swatches button{all:unset;cursor:pointer;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;height:26px;border:1px solid var(--rule);overflow:hidden;box-sizing:border-box}
  .swatches button span{display:block}
  .swatches button.on{outline:2px solid var(--brass);outline-offset:1px}
  .swatches.pat button{display:block;height:auto;aspect-ratio:1}
  .swatches .thumb{width:100%;height:100%;display:block}
  .trow input[type=text]{flex:1;min-width:0;background:#101216;color:var(--paper);border:1px solid #3a3e46;border-radius:2px;font-size:12px;padding:4px 6px}
  /* 접기 손잡이 — 좌우 가장자리 */
  .foldtab{position:fixed;top:50%;transform:translateY(-50%);z-index:9;background:rgba(18,20,24,.92);color:var(--paper-dim);border:1px solid var(--rule);
    font-size:11px;letter-spacing:.12em;padding:12px 6px;cursor:pointer;writing-mode:vertical-rl;text-orientation:mixed}
  .foldtab:hover{color:var(--paper);border-color:var(--brass)}
  .foldtab.right{right:0;border-right:none;border-radius:3px 0 0 3px}
  .foldtab.left{left:0;border-left:none;border-radius:0 3px 3px 0}
  #hud,#title,#fleet,#legend{transition:transform .3s,opacity .3s}
  body.fold-r #hud,body.fold-r #panel{transform:translateX(112%) !important;opacity:0 !important;pointer-events:none !important}
  body.fold-l #title,body.fold-l #fleet,body.fold-l #legend{transform:translateX(-112%);opacity:0;pointer-events:none}
  /* 안내 */
  #hint{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:5;font-size:12px;color:var(--paper-dim);letter-spacing:.06em;transition:opacity .6s;pointer-events:none}
  #hint.off{opacity:0}

  @media (max-width:980px){
    #hud{width:min(300px,60vw);right:14px;top:14px;padding:10px 12px}
    #panel{right:0;left:0;top:auto;bottom:0;width:auto;height:58vh;border-radius:6px 6px 0 0;transform:translateY(20px)}
    #panel.show{transform:none}
    #title{left:14px;top:14px}
    #fleet{left:14px;top:104px}
    #legend{left:14px;bottom:14px}
    #legend button{padding:4px 9px 4px 7px;font-size:12px}
    #hint{bottom:12px}
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>

<div id="title">
  <h1>shipia</h1>
  <p>부분과 전체 · 배 — 선단을 갈아 끼우며 결정을 본다</p>
  <span id="edition"></span>
</div>

<div id="fleet"><div class="sec">선단</div></div>

<div id="legend"><div class="sec">계통 8+1</div></div>

<div id="hud">
  <div class="h-ship" id="h-ship"></div>
  <div class="h-dim" id="h-dim"></div>
  <div class="h-stamp" id="h-stamp"></div>
  <div class="h-hover" id="h-hover"></div>
  <div class="h-tools">
    <button id="t-labels" class="on">이름표</button>
    <button id="t-center" title="시점 되돌리기 (0)">중심</button>
    <button id="t-xray">속 보기</button>
    <button id="t-tune">튜닝</button>
    <button id="t-lock" style="display:none">갑문</button>
    <button id="t-cards">카드</button>
    <button id="t-ledger">장부</button>
  </div>
</div>

<aside id="panel">
  <nav id="ptabs"><button data-tab="part" class="on">부품</button><button data-tab="card">카드</button><button data-tab="ledger">장부</button><button data-tab="tune">튜닝</button><button id="pclose" title="닫기">×</button></nav>
  <div id="pbody"></div>
  <div id="pfoot"><button id="btn-export">내보내기</button><button id="btn-import">가져오기</button><span id="note-count"></span></div>
</aside>

<button class="foldtab right" id="fold-r" title="우측 표찰 접기/펼치기">표찰 접기</button>
<button class="foldtab left" id="fold-l" title="좌측 선단 접기/펼치기">선단 접기</button>
<div id="hint">드래그로 돌리고 · 오른 단추나 Shift로 옮기고 · 휠로 당기고 · 부품을 누르십시오</div>
<div id="pop" role="dialog"></div>
<input type="file" id="file-import" accept="application/json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ─────────────────────────────────────────────────────────────
   shipia — DATA 블록. v1의 자료를 그대로 이식했습니다. 여기만 고치면 됩니다.

   · 도장 문법:  {準|서명}  {典|장부번호(쉼표 구분)}  {推|사유}  {聞|출처}
   · 생산 꼬리표: 〔기〕〔선〕〔전〕〔각〕
   · 서랍(物·化·數·哲)은 표찰에서 ✎로 고쳐 쓸 수 있고, '내보내기'가 shipia-notes.json 으로 담습니다.
     영구히 박으려면 그 JSON의 내용을 아래 CARDS 에 옮겨 적으십시오.
   · GEO — 3D의 치수. 주요 치수는 典, 곡면과 배치는 推. 화면 우상단 낙인이 이것을 늘 밝힙니다.
   ───────────────────────────────────────────────────────────── */

const META = {
  edition: '2026년 9월 발주 기준',
  motto: '확인 못 한 것을 확인했다고 말하지 않는다',
};

const SOURCES = [
  {no:1,  t:'MAN Energy Solutions — LNG선 최적화 FGSS 기술자료: 주기관 공급 300 bar·45℃, 발전기용 6 bar. 고압 경로는 다단 BOG 압축기 또는 고압펌프+기화기(PVU).'},
  {no:2,  t:'WinGD — 저압 X-DF 연료가스 공급 6~16 bar. 고압 압축기 스키드 중량 최대 6배, LNG선 추진계 자본비 최대 40% 차이 주장(제조사 간 공방 속 주장값임을 명기).'},
  {no:3,  t:'MAN Energy Solutions — ME-GI 메탄 슬립 0.2~0.28 g/kWh 보증(25~100% 부하).'},
  {no:4,  t:'WinGD — X-DF 2.x + on-engine iCER: 슬립 1.0~1.2 g/kWh(1세대 2.0~2.5에서 반감).'},
  {no:5,  t:'업계 보도 종합 — 추진효율 계보: 증기터빈 30% 미만 → DFDE 40%대 → 2행정 이중연료 50% 수준(제조사 측 값, 시운전 실측 아님).'},
  {no:6,  t:'MAN Energy Solutions — 저압형 ME-GA 단종 발표. 사유: 2027년으로 예상되는 IMO 메탄 슬립 규제.'},
  {no:7,  t:'EMSA THETIS-MRV — 2024 보고연도 공개판 v238(2026-09-04 생성), 14,159척. 2026-09-05 직접 내려받아 열람. 공개 API로 2018~2025년분 재조회 가능.'},
  {no:8,  t:'한화오션·한화엔진 (2025-02) — 174,000 m³ LNG선 2척분 MAN B&W 5G70ME-GI Mk10.5 주기관 4기 발주, EGRBP 통합.'},

  {no:22, t:'DSIC 175,000 m³ LNG선 착공 보도(2026-07) — 전장 299.7 / 폭 46 / 깊이 26.2 / 설계흘수 11.5 m, 19.5 kn.'},
  {no:23, t:'S&P Global Platts 방법론(2026-06) — 표준선 174,000 m³, 적재 BOR 0.12%/day, 공선 0.09%/day, 항내는 적재의 25%, 적재 가능 용적 98.5%.'},
  {no:24, t:'Burckhardt Compression Laby-GI 기술자료 — ME-GI용 300 bar 표준 패키지 4/5/6LP250V: 1,500~2,300 kW, 3,100~5,700 kg/h, 치수 11.5 × 7 × 5.5 m. FSRU/FSU용 30~110 bar. 용도 목록에 \'Minimum send-out on FSRU\' 명시.'},

const CARDS = [
 {id:'c1', num:'하나', title:'331이냐 13이냐', term:'HP FGSS vs LP FGSS',
  coord:'Fuel Gas Supply System × Propulsion', ships:['gap','eul'],
  intro:`같은 선체, 같은 화물창, 같은 항로. 다른 것은 단 하나 — 탱크에서 나온 기체를 몇 bar로 엔진에 넣는가. 그리고 그 답을 정하는 것은 분사의 시점이다. 디젤사이클(ME-GI)은 피스톤이 공기를 다 누른 꼭대기에서 가스를 뿜는다. 실린더 안이 이미 수백 bar이니, 그걸 이기고 들어가려면 300 bar급이 필요하다 {典|1}. 오토사이클(X-DF)은 피스톤이 내려가는 초입, 낮은 압력의 흡기에 가스를 미리 섞는다. 그래서 16 bar 아래면 충분하다 {典|2}. 언제 넣느냐가 얼마로 넣느냐를 정하고, 얼마로 넣느냐가 배 한 척의 기계 목록을 정한다.`,

  why:`값을 치르는 방식이 다르다. 고압의 값은 쇳값이다 — 압축기 스키드 중량 최대 여섯 배, 추진계 자본비 최대 40% 높다는 추산 {典|2} (이해당사자 공방 속 숫자임을 명기한다). 그리고 쇳값만이 아니다 — 300 bar 배관은 이중관과 방폭 구역을 데리고 오고 {聞|준철}, 그 무게와 길이는 〔기〕〔선〕의 공수로 청구된다. 저압의 값은 흘리는 메탄이다 — MAN은 2027년으로 내다본 IMO 메탄 규제를 이유로 자사의 저압형(ME-GA)을 단종했다 {典|6}. 한쪽은 지금 강철로 내고, 한쪽은 나중에 대기로 낸다.`,
  drawers:{
   phys:`압축의 품삯은 온도와 압축비가 정한다 — 등온 근사로 일 ∝ T·ln(P₂/P₁). 탱크압 1.06 bar에서 출발하면 ln(300/1.06) 대 ln(16/1.06) ≈ 2.1배: 같은 기체를 두 배의 품으로 밀어 올리는 것이 고압의 길이다 {推|등온 근사, 다단 중간냉각 미반영}. 그리고 예혼합의 저주 — 미리 섞은 혼합기는 고르게 타지만 실린더 벽 틈새에 숨은 몫이 불길을 피해 살아 나간다. 그게 슬립이다. 확산연소는 다 태우는 대신 뜨거운 불꽃이 질소를 태워 NOx를 남긴다. 완전히 공짜인 연소는 없다.`,

 {id:'c2', num:'둘', title:'태우느냐 되돌리느냐', term:'Reliquefaction vs Consumption',

  intro:`모든 물질에는 임계온도가 있다 — 그보다 뜨거우면 아무리 눌러도 액체가 되지 않는 선. 프로판은 약 +97℃, 암모니아는 약 +132℃, 메탄은 −83℃다 {推|물성표, 장부 20 확정 예정}. 바닷물은 늘 상온 언저리니, 프로판과 암모니아는 눌러서 바닷물로 식히면 도로 액체가 된다. 메탄은 안 된다 — 지구의 어느 바다도 −83℃보다 차갑지 않으니까. 끓어 나온 기체를 되돌릴 수 있는 화물과 없는 화물. 이 한 줄이 두 선단의 운명을 갈랐다.`,

const SEAL_DESC={'準':'설계 결정','典':'공개 출전','推':'추정','聞':'현업 증언'};
function fmt(t){
  if(!t) return '';
  return t.replace(/\{(準|典|推|聞)\|([^}]*)\}/g,(m,k,v)=>{
     if(k==='典'){ const nums=v.split(',').map(s=>s.trim()).filter(Boolean);
       return '<button class="seal s典" data-k="典" data-v="'+nums.join(',')+'">典<sup>'+nums.join('·')+'</sup></button>'; }
     return '<button class="seal s'+k+'" data-k="'+k+'" data-v="'+v.replace(/"/g,'&quot;')+'">'+k+'</button>';
   }).replace(/〔(각|선|기|전)〕/g,'<span class="ptag">$1</span>');
}
function sealBind(root){
  $$('.seal[data-k]',root).forEach(b=>{ b.addEventListener('click',e=>{ e.stopPropagation(); const k=b.dataset.k,v=b.dataset.v; if(k==='典') highlightSources(v.split(',')); showPop(b,k,v); }); });
}
function showPop(anchor,k,v){
  let body; if(k==='典') body='장부 '+v.split(',').join(', ')+'번 — 표찰의 장부 탭에서 밝혀 두었습니다.';
  else if(k==='準') body='서명: '+v; else if(k==='推') body=v?('사유: '+v):'사유 미기재 — 확정 대기'; else body='출처: '+v;
  pop.innerHTML='<span class="pk">'+k+' · '+SEAL_DESC[k]+'</span>'+body;
  const r=anchor.getBoundingClientRect(); pop.style.display='block';
  const pw=Math.min(300,window.innerWidth-24);
  pop.style.left=Math.min(Math.max(10,r.left),window.innerWidth-pw-12)+'px'; pop.style.top=(r.bottom+8)+'px';
}
document.addEventListener('click',e=>{ if(!e.target.closest('.seal')&&!e.target.closest('#pop')) pop.style.display='none'; });

  }

  for(const key of ['phys','chem','math','phil']){

    h+='<div class="drawer" data-card="'+c.id+'" data-drawer="'+key+'"><div class="dhead" role="button" tabindex="0" aria-expanded="false"><span><span class="dchar">'+ch+'</span>'+ko+
       '<button class="dedit" title="원문(도장 문법)으로 고쳐쓰기">✎</button></span><span class="arrow">▾</span></div><div class="dbody"><div class="rendered">'+fmt(txt)+'</div></div></div>';

function bindDrawers(root){
  $$('.drawer',root).forEach(dr=>{
    const head=$('.dhead',dr);
    const toggle=()=>{ dr.classList.toggle('open'); const open=dr.classList.contains('open'); $('.arrow',head).textContent=open?'▴':'▾'; head.setAttribute('aria-expanded',open?'true':'false'); };
    head.addEventListener('click',e=>{ if(e.target.closest('.dedit')) return; toggle(); });
    head.addEventListener('keydown',e=>{ if(e.target.closest('.dedit')) return; if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(); } });
    $('.dedit',dr).addEventListener('click',e=>{
      e.stopPropagation(); dr.classList.add('open');
      const key=dr.dataset.card+'.'+dr.dataset.drawer; const card=CARDS.find(x=>x.id===dr.dataset.card);
      const cur=notes[key] ?? card.drawers[dr.dataset.drawer]; const body=$('.dbody',dr); body.innerHTML='';
      const ta=document.createElement('textarea'); ta.className='raw'; ta.value=cur; body.appendChild(ta); ta.focus();
      ta.addEventListener('blur',()=>{ const v=ta.value.trim(); const orig=card.drawers[dr.dataset.drawer];
        if(v && v!==orig) notes[key]=v; else delete notes[key];
        body.innerHTML='<div class="rendered">'+fmt(notes[key] ?? orig)+'</div>'; sealBind(body); updateNoteCount(); });
    });
  });
}

function hullHalfGeometry(L,hB,T,Dk,side,bowLen=52.5,sternLen=57.5){
  const N=80, bowS=L/2-bowLen, sternS=-L/2+sternLen;
  const half=(x)=>{
    let hb=hB, keel=-T, deck=Dk;
    if(x>bowS){ const t=(x-bowS)/(L/2-bowS); hb=hB*Math.pow(Math.max(0,1-Math.pow(t,2.6)),0.9); const u=Math.max(0,(t-0.5)/0.5); keel=-T+(T-2.5)*Math.pow(u,1.6); deck=Dk+3.2*t*t; }
    else if(x<sternS){ const t=(sternS-x)/(L/2+sternS); hb=hB*(1-0.40*Math.pow(t,1.7)); deck=Dk+1.4*t; }
    const kLen=Math.min(26,sternLen*0.45), sternK=-L/2+kLen; if(x<sternK){ const tk=(sternK-x)/kLen; keel=-T+(T+1.2)*Math.pow(tk,0.45); }
    hb=Math.max(hb,0.7);
    const r=Math.min(4.5, hb*0.55, Math.max(0.2,(deck-keel)*0.35)), pts=[];
    const nb=4,na=6,ns=6,nd=4;
    for(let i=0;i<=nb;i++) pts.push([keel,(hb-r)*i/nb]);
    for(let i=1;i<=na;i++){ const a=-Math.PI/2+(Math.PI/2)*i/na; pts.push([keel+r+r*Math.sin(a), hb-r+r*Math.cos(a)]); }
    for(let i=1;i<=ns;i++) pts.push([keel+r+(deck-keel-r)*i/ns, hb]);
    for(let i=1;i<=nd;i++){ const z=hb*(1-i/nd); pts.push([deck+0.5*(1-Math.pow(z/hb,2)), z]); }
    return pts;
  };
  const pos=[], uv=[], idx=[]; let K=0;
  const U=(xn)=> side>0 ? 0.5*xn : 0.5+0.5*(1-xn);
  for(let i=0;i<=N;i++){ const x=-L/2+L*i/N, h=half(x); K=h.length; h.forEach(p=>{ pos.push(x,p[0],p[1]*side); uv.push(U(i/N),(p[0]+14)/40); }); }
  for(let s=0;s<N;s++) for(let k=0;k<K-1;k++){ const a=s*K+k, b=s*K+k+1, c=(s+1)*K+k, d=(s+1)*K+k+1; idx.push(a,c,b, b,c,d); }
  [[0,-L/2],[N,L/2]].forEach(([s,x])=>{ let cy=0; for(let k=0;k<K;k++) cy+=pos[(s*K+k)*3+1]; cy/=K; const ci=pos.length/3; pos.push(x,cy,0); uv.push(U(s/N),(cy+14)/40); for(let k=0;k<K-1;k++) idx.push(ci, s*K+k, s*K+k+1); });
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2)); g.setIndex(idx); g.computeVertexNormals(); return g;
}

function paintTile(S, pattern, c1, c2){
  const c=document.createElement('canvas'); c.width=c.height=S; const g=c.getContext('2d');
  g.fillStyle=c1; g.fillRect(0,0,S,S);
  let seed=11; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  const u=S/160;
  switch(pattern){
    case 'checker': { const n=4, k=S/n; g.fillStyle=c2; for(let i=0;i<n;i++) for(let j=0;j<n;j++) if((i+j)%2) g.fillRect(i*k,j*k,k,k); break; }
    case 'dots': { const n=6, k=S/n; g.fillStyle=c2; for(let i=0;i<n;i++) for(let j=0;j<n;j++){ g.beginPath(); g.arc(i*k+k/2,j*k+k/2,k*0.22,0,Math.PI*2); g.fill(); } break; }
    case 'hex': { const r=S/6, h=r*Math.sqrt(3); g.strokeStyle=c2; g.lineWidth=1.6*u;
      for(let row=-1;row<7;row++) for(let col=-1;col<7;col++){ const x=col*1.5*r, y=row*h+(col%2?h/2:0); g.beginPath(); for(let k=0;k<6;k++){ const a=Math.PI/3*k; const px=x+r*Math.cos(a), py=y+r*Math.sin(a); k?g.lineTo(px,py):g.moveTo(px,py); } g.closePath(); g.stroke(); } break; }
    case 'grid': { g.strokeStyle=c2; g.lineWidth=1.2*u; const k=S/5; for(let i=0;i<=5;i++){ g.beginPath(); g.moveTo(i*k,0); g.lineTo(i*k,S); g.moveTo(0,i*k); g.lineTo(S,i*k); g.stroke(); } break; }
    case 'halftone': { const n=8, k=S/n; g.fillStyle=c2; for(let i=0;i<n;i++) for(let j=0;j<n;j++){ const rr=k*0.5*(0.15+0.85*(i/n)); g.beginPath(); g.arc(i*k+k/2,j*k+k/2,rr,0,Math.PI*2); g.fill(); } break; }
    case 'brushed': { for(let y=0;y<S;y+=2){ g.fillStyle=(rnd()<0.5?c2:c1); g.globalAlpha=0.10+rnd()*0.12; g.fillRect(0,y,S,1); } g.globalAlpha=1; break; }
    case 'weave': { const k=S/8; for(let i=0;i<8;i++) for(let j=0;j<8;j++){ g.fillStyle=((i+j)%2)?c2:c1; g.globalAlpha=0.55; g.fillRect(i*k,j*k,k,k); g.globalAlpha=0.25; g.fillStyle='#000'; g.fillRect(i*k,j*k+((i+j)%2?0:k/2),k,1); } g.globalAlpha=1; break; }
    case 'camo': { for(let i=0;i<26;i++){ g.fillStyle=i%3?c2:c1; g.globalAlpha=0.7; g.beginPath(); const x=rnd()*S,y=rnd()*S; g.moveTo(x,y); for(let k=0;k<6;k++) g.lineTo(x+(rnd()-0.5)*S*0.5,y+(rnd()-0.5)*S*0.5); g.closePath(); g.fill(); } g.globalAlpha=1; break; }
    case 'ink': { for(let i=0;i<10;i++){ const x=rnd()*S,y=rnd()*S,r=(20+rnd()*60)*u; const gr=g.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,c2); gr.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=gr; g.globalAlpha=0.8; g.fillRect(0,0,S,S); } g.globalAlpha=1; break; }
    case 'splatter': { g.fillStyle=c2; for(let i=0;i<90;i++){ g.beginPath(); g.arc(rnd()*S,rnd()*S,(0.6+rnd()*3.2)*u,0,Math.PI*2); g.fill(); } break; }
    case 'flake': { for(let i=0;i<420;i++){ g.fillStyle=rnd()<0.6?c2:'#ffffff'; g.globalAlpha=0.35+rnd()*0.5; g.fillRect(rnd()*S,rnd()*S,1.2*u,1.2*u); } g.globalAlpha=1; break; }
    case 'holo': { const gr=g.createLinearGradient(0,0,S,S); ['#ff6b6b','#ffd166','#06d6a0','#4cc9f0','#b892ff','#ff6b6b'].forEach((h,i,a)=>gr.addColorStop(i/(a.length-1),h)); g.fillStyle=gr; g.globalAlpha=0.55; g.fillRect(0,0,S,S); g.globalAlpha=1; break; }
  }
  return c;
}
let liveryTex=null, hullMeshes=[], bulbMesh=null;
function paintHull(){
  const W=2048,H=512, c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d');
  const P=PAL(), Dk=TUNE.depth-TUNE.draft, Y=(y)=>Math.round((1-(y+14)/40)*H);
  g.fillStyle=P.rim; g.fillRect(0,0,W,H);                                     // 물 아래: 방오
  const topRow=0, botRow=Y(1.7), tile=paintTile(160,LIV.pattern,P.base,P.accent);
  for(const side of ['s','p']){
    const x0=side==='s'?0:W/2, w=W/2, um=(xn)=>side==='s'?x0+w*xn:x0+w*(1-xn);
    g.save(); g.beginPath(); g.rect(x0,topRow,w,botRow-topRow); g.clip();
    g.fillStyle=P.base; g.fillRect(x0,topRow,w,botRow-topRow);
    switch(LIV.pattern){
      case 'solid': break;
      case 'fade': { const gr=g.createLinearGradient(um(0),0,um(1),0); gr.addColorStop(0,P.base); gr.addColorStop(1,P.accent); g.fillStyle=gr; g.fillRect(x0,topRow,w,botRow-topRow); break; }
      case 'fadev': { const gr=g.createLinearGradient(0,Y(Dk+3),0,Y(1.7)); gr.addColorStop(0,P.base); gr.addColorStop(1,P.accent); g.fillStyle=gr; g.fillRect(x0,topRow,w,botRow-topRow); break; }
      case 'stripe': { g.fillStyle=P.accent; g.fillRect(x0,Y(Dk-1.6),w,Math.max(2,Y(Dk-2.4)-Y(Dk-1.6))); g.fillRect(x0,Y(Dk-3.4),w,Math.max(3,Y(Dk-4.9)-Y(Dk-3.4))); break; }
      case 'pinstripe': { g.fillStyle=P.accent; for(let y=2.6;y<Dk+2;y+=1.5) g.fillRect(x0,Y(y),w,2); break; }
      default: { g.fillStyle=g.createPattern(tile,'repeat'); g.fillRect(x0,topRow,w,botRow-topRow); }
    }
    g.fillStyle=P.text; g.textAlign='center'; g.textBaseline='middle';
    if((LIV.hullText||'').trim()){ const px=Math.round(5.8/40*H); g.font='700 '+px+'px "'+LIV.font+'", "Noto Sans KR", sans-serif'; g.fillText(LIV.hullText.trim(), um(0.5), Y(Dk/2+1.2)); }
    if((LIV.shipName||'').trim()){ const px=Math.round(3.0/40*H); g.font='700 '+px+'px "'+LIV.font+'", "Noto Sans KR", sans-serif'; g.fillText(LIV.shipName.trim(), um(0.845), Y(Dk-2.4)); }
    g.restore();
  }
  g.fillStyle=P.accent; g.fillRect(0,Y(1.7),W,Y(-0.05)-Y(1.7));                // 부트탑 띠
  g.fillStyle='rgba(0,0,0,.09)'; for(let y=2.5;y<Dk+12;y+=2.6) g.fillRect(0,Y(y),W,1);   // 외판 이음줄
  const t=new THREE.CanvasTexture(c); t.anisotropy=renderer.capabilities.getMaxAnisotropy(); return t;
}
function applyLivery(){
  const old=liveryTex; liveryTex=paintHull();

  if(bulbMesh) bulbMesh.material.color.set(PAL().rim);
  if(old) old.dispose();
}

function beginBuild(){

}
function hullAt(lay,x){ const {L,hB,T,Dk}=lay, bowS=L/2-lay.bowLen, sternS=-L/2+lay.sternLen; let hb=hB,keel=-T,deck=Dk;
  if(x>bowS){ const t=(x-bowS)/(L/2-bowS); hb=hB*Math.pow(Math.max(0,1-Math.pow(t,2.6)),0.9); const u=Math.max(0,(t-0.5)/0.5); keel=-T+(T-2.5)*Math.pow(u,1.6); deck=Dk+3.2*t*t; }
  else if(x<sternS){ const t=(sternS-x)/(L/2+sternS); hb=hB*(1-0.40*Math.pow(t,1.7)); deck=Dk+1.4*t; }
  const kLen=Math.min(26,lay.sternLen*0.45), sternK=-L/2+kLen; if(x<sternK){ const tk=(sternK-x)/kLen; keel=-T+(T+1.2)*Math.pow(tk,0.45); }
  return {hb:Math.max(hb,0.7),keel,deck}; }
function addHull(lay, note){
  const {L,hB,T,Dk}=lay;
  const info={id:'hull', sys:'hull', name:()=>'선체 — 길이 '+TUNE.loa+' · 폭 '+TUNE.beam+' · 깊이 '+TUNE.depth+' · 흘수 '+TUNE.draft+' m', note};
  [1,-1].forEach(side=>{ const hm=part(new THREE.Mesh(hullHalfGeometry(L,hB,T,Dk,side,lay.bowLen,lay.sternLen), M.hull), Object.assign({},info,{id:'hull'+(side>0?'S':'P')})); if(liveryTex){ hm.material.map=liveryTex; hm.material.color.set(0xffffff); hm.material.needsUpdate=true; } HULLFAM.push(hm); hullMeshes.push(hm); });
  const bl=Math.min(11,L*0.037), br=Math.min(4.5,Math.max(1.1,T*0.39));
  const bulb=part(new THREE.Mesh(new THREE.SphereGeometry(1,20,14), M.anti),{id:'bulb', sys:'hull', name:'구상선수 — 파도를 미리 가르는 혹', note:'선수파를 상쇄해 저항을 줄인다. 형상 {推|통례}.'}); bulb.scale.set(bl,br,br); bulb.position.set(lay.bow-bl*0.82,-T*0.66,0); HULLFAM.push(bulb); bulbMesh=bulb; bulb.material.color.set(PAL().rim);
}

/* ── 이름표: 고정 이름표 + 계통 선택 시 그 계통의 부품 이름 ── */
const labelsEl=$('#labels'); let labelNodes=[]; let showLabels=true;
function rebuildLabelNodes(){ labelsEl.innerHTML=''; labelNodes=LABELS.concat(DYN).map(l=>{ const d=document.createElement('div'); d.className='lbl'+(l.dyn?' dyn':''); d.textContent=l.t; labelsEl.appendChild(d); return d; }); }
$('#t-labels').onclick=()=>{ showLabels=!showLabels; $('#t-labels').classList.toggle('on',showLabels); };
function updateLabels(){ const v=new THREE.Vector3(); const all=LABELS.concat(DYN);
  all.forEach((l,i)=>{ const d=labelNodes[i]; if(!d) return; v.set(l.p[0],l.p[1],l.p[2]).project(camera); const on=showLabels && (!curSys || l.dyn) && v.z<1 && Math.abs(v.x)<1.1 && Math.abs(v.y)<1.1;
    d.style.display=on?'block':'none'; if(on){ d.style.left=((v.x+1)/2*innerWidth)+'px'; d.style.top=((1-v.y)/2*innerHeight)+'px'; } }); }

/* ── 카메라 궤도 ── */
const cam={theta:3.72, phi:1.12, r:640, target:new THREE.Vector3(-15,6,0)};

  if(drag){ const dx=e.clientX-drag.x, dy=e.clientY-drag.y; moved+=Math.abs(dx)+Math.abs(dy);
    if(panMode) panBy(dx,dy); else { cam.theta-=dx*0.0055; cam.phi=Math.min(1.52,Math.max(0.12,cam.phi-dy*0.0045)); placeCamera(); }
    drag={x:e.clientX,y:e.clientY}; touch(); } else hover(e); });

function applyState(flash){

    const forShip=(u.ship==='both'||u.ship===curShip); p.visible=forShip; if(!forShip) return;
    const m=p.material; let op=u.baseOp;

      if(u.sys===curSys){ if(!u.isLine){ m.emissive=selColor.clone().multiplyScalar(0.55); m.emissiveIntensity=1.0; } op=Math.max(op, u.isLine?0.95:(HULLFAM.includes(p)?0.55:0.98)); }
      else { op*=(HULLFAM.includes(p)?0.35:0.06); if(!u.isLine) m.emissive=new THREE.Color(0x000000); }

/* ── 계기판 산수 — 선체마다 다른 셈. 끓음(BOG)과 갈증(연료 수요)의 저울 ── */
function stats(){
  const L=TUNE.loa, B=TUNE.beam, T=TUNE.draft, n=TUNE.tanks, c=GEOS[curType].c, v=TUNE.speed;
  const disp=(L-5)*B*T*c.cb*1.025, fn=v*0.5144/Math.sqrt(9.81*L);
  const P=c.pRef*Math.pow(v/c.vRef,3)*Math.pow(L/TUNE_DEF.loa,0.6);
  const gasMain=P*c.sgc*24/1000, gasGen=c.hotel*c.sgcGen*24/1000, demand=gasMain+gasGen;
  let cargo=0;
  if(curType==='lngc'||curType==='vlgc'){ const area=LAY.tankW*(LAY.tankY[1]-LAY.tankY[0])-2*LAY.ch*LAY.ch; cargo=n*LAY.tl*area*c.calib; }
  else if(curType==='box'){ cargo=(LAY.fuel.x[1]-LAY.fuel.x[0])*LAY.fuel.w*(LAY.fuel.y[1]-LAY.fuel.y[0])*c.calib; }
  else { cargo=n*(Math.PI*LAY.tankR*LAY.tankR*LAY.tankLc+4/3*Math.PI*Math.pow(LAY.tankR,3))*c.calib; }
  const mass=cargo*c.rho, bog=mass*TUNE.bor/100;
  const out={cargo, disp, mass, bog, P, gasMain, gasGen, demand, balance:bog-demand, fn};
  if(curType==='lngc'){ out.cap=TUNE.skids*TUNE.skidCap*24/1000; out.util=bog/out.cap; }
  if(curType==='vlgc'){ out.cargoPct=demand/mass*100; out.deckTank=2*450*c.rho; out.deckDays=out.deckTank/demand; }
  if(curType==='box'){ out.days=mass/demand; out.range=out.days*v*24; out.forced=Math.max(0,demand-bog); }
  if(curType==='bv'){ out.holdDays=mass*3.5*19/(bog*510); out.fills=18600/cargo; out.dayPct=demand/mass*100; }
  return out;
}

    '<div class="surplus"><em>참는 시간 — 1.7에서 약 4 bara까지 (거친 셈)</em><b>'+fmtN(st.holdDays)+' 일</b></div>'+
    '<div><em>발전기 갈증 @'+v+' kn ('+fmtN(st.P)+' kW) — 자기 화물로</em><b>'+fmtN(st.demand,1)+' t/일 · '+st.dayPct.toFixed(2)+' %/일</b></div>'+
    '<div><em>무 한 척(18,600 m³)을 채우려면</em><b>'+st.fills.toFixed(1)+' 번</b></div>'; }
  h+='<div><em>프루드 수 Fn = v/√(gL)</em><b>'+st.fn.toFixed(3)+'</b></div>';
  return h;
}
let tuneTimer=null;
function bindTune(){
  $$('#pbody [data-t]').forEach(inp=>{ const apply=()=>{ const k=inp.dataset.t; TUNE[k]=parseFloat(inp.value); if(k==='skidCap') TUNE[k]=parseInt(inp.value); const tv=inp.parentElement.querySelector('.tval'); if(tv && k!=='skidCap') tv.textContent=inp.value+tv.textContent.replace(/^[\d.\-]+/,'');
      const geo=['loa','beam','depth','draft','tanks','skids'].includes(k);
      if(geo){ clearTimeout(tuneTimer); tuneTimer=setTimeout(()=>{ buildShip(); cam.target.set(-TUNE.loa*0.05,TUNE.loa*0.02+3,0); placeCamera(); applyState(false); },90); }
      else applyState(false); };
    inp.addEventListener('input',apply); inp.addEventListener('change',apply); });
  const r=$('#t-reset'); if(r) r.onclick=()=>{ GEO_KEYS.forEach(k=>{ if(k in TUNE_DEF) TUNE[k]=TUNE_DEF[k]; }); buildShip(); resetCamera(); applyState(false); fillPanel(); };
  const sp=$('#sw-pal'); if(sp){ PALETTES.forEach((p,i)=>{ const b=document.createElement('button'); b.title=p.name; b.classList.toggle('on',LIV.palette===i); b.innerHTML='<span style="background:'+p.base+'"></span><span style="background:'+p.accent+'"></span><span style="background:'+p.rim+'"></span><span style="background:'+p.text+'"></span>';
      b.onclick=()=>{ LIV.palette=i; $$('#sw-pal button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); $('#sw-name').textContent=p.name; applyLivery(); }; sp.appendChild(b); }); }
  const spt=$('#sw-pat'); if(spt){ PATTERNS.forEach(([k,l])=>{ const b=document.createElement('button'); b.title=l; b.classList.toggle('on',LIV.pattern===k); const th=paintTile(48,k,PAL().base,PAL().accent); th.className='thumb'; b.appendChild(th);
      b.onclick=()=>{ LIV.pattern=k; $$('#sw-pat button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); applyLivery(); }; spt.appendChild(b); }); }
  let livTimer=null;
  $$('#pbody [data-l]').forEach(inp=>{ inp.addEventListener('input',()=>{ LIV[inp.dataset.l]=inp.value; clearTimeout(livTimer);
    livTimer=setTimeout(()=>{ if(inp.dataset.l==='font' && document.fonts && document.fonts.load) document.fonts.load('700 40px "'+LIV.font+'"').then(applyLivery,applyLivery); else applyLivery(); },160); }); });
}

/* ── 계통도 — 어떻게 이어지나. 선체마다 다른 그림 ── */
function fgssSVG(ship){
  const type=HULLTYPE[ship], gap=ship==='gap', jeong=ship==='jeong';
  const c={v:'#a9a49a',lp:'#8fa3b8',hp:'#cf6a55',ret:'#7fb0c8',liq:'#e0b070',ink:'#e9e5dc',dim:'#9a958b',box:'#1b1e24'};
  const B=(x,y,w,h,t,sub,dash)=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="2" fill="'+c.box+'" stroke="'+c.dim+'"'+(dash?' stroke-dasharray="4 3"':'')+'/><text x="'+(x+w/2)+'" y="'+(y+h/2-(sub?2:-4))+'" text-anchor="middle" fill="'+c.ink+'" font-size="11">'+t+'</text>'+(sub?'<text x="'+(x+w/2)+'" y="'+(y+h/2+11)+'" text-anchor="middle" fill="'+c.dim+'" font-size="9.5">'+sub+'</text>':'');
  const P=(d,col,w=2,dash)=>'<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="'+w+'"'+(dash?' stroke-dasharray="5 3"':'')+' marker-end="url(#a)"/>';
  const T=(x,y,t)=>'<text x="'+x+'" y="'+y+'" fill="'+c.dim+'" font-size="9.5">'+t+'</text>';
  let s='<svg viewBox="0 0 340 250" width="100%" style="display:block;margin-top:6px"><defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="'+c.dim+'"/></marker></defs>';
  if(type==='lngc'){
    s+=B(8,100,64,44,'화물창','−160℃ · 1.06 bara');
    if(gap){ s+=B(110,72,74,34,'압축기 1~3단','저압 · ~6 bar')+B(110,124,74,34,'압축기 4~5단','고압 · 300 bar')+P('M72,116 L110,89',c.v)+P('M147,106 L147,124',c.v,2)+P('M184,89 L262,89',c.lp)+B(262,72,70,34,'발전기 ×4','4행정 DF · 6 bar')+P('M184,141 L262,141',c.hp,3)+B(262,124,70,34,'주기관 ×2','ME-GI · 300 bar')+P('M147,158 L147,196',c.hp,2)+B(110,196,74,34,'재액화 PRS','팽창 → 액체')+P('M110,213 C60,213 40,190 40,144',c.ret,2)+P('M184,80 C215,60 240,40 262,36',c.v,1.5)+B(262,20,70,30,'GCU','잉여 소각')+P('M40,144 C40,225 100,232 110,224',c.liq,1.5,true)+T(8,243,'점선 = 강제 기화(FBOG) 경로 · 갑: 고압을 재액화가 얻어 쓴다'); }
    else { s+=B(110,98,74,38,'저압 압축기','6~16 bar · 점선(치수 미확정)',true)+P('M72,116 L110,117',c.v)+P('M184,108 L262,89',c.lp)+B(262,72,70,34,'발전기 ×4','4행정 DF · 6 bar')+P('M184,126 L262,141',c.lp,3)+B(262,124,70,34,'주기관 ×2','X-DF · 6~16 bar')+P('M72,130 C80,200 100,213 110,213',c.v,2)+B(110,196,74,34,'재액화 유닛','별도 냉동 사이클 · 推',true)+P('M110,205 C60,205 40,190 40,144',c.ret,2,true)+P('M184,104 C215,60 240,40 262,36',c.v,1.5)+B(262,20,70,30,'GCU','잉여 소각')+P('M40,144 C40,225 100,232 110,224',c.liq,1.5,true)+T(8,243,'점선 = 추정 · 을: 재액화가 압축기의 고압을 빌리지 못한다'); }
  } else if(type==='vlgc'){
    s+=B(8,96,64,44,'Type A 화물창',jeong?'−42℃ · LPG / NH₃':'−42℃ · 대기압');
    s+=P('M72,106 L110,84',c.v)+B(110,66,74,34,'화물 압축기 ×3','~20 bar · 推')+P('M184,83 L226,83',c.v)+B(226,66,86,34,'해수 응축기 ×2','바닷물로 액화')+P('M269,100 C269,140 200,150 110,150 L72,150',c.ret,2)+B(110,136,74,28,'수액기','액체가 잠시');
    s+=P('M40,140 C40,200 90,206 110,206',c.liq,1.5)+B(110,190,74,32,'갑판 탱크 ×2','450 m³ · 등급 전환 · 연료')+P('M184,206 L226,206',c.liq,2)+B(226,190,86,32,'펌프 ×2 + 가열기','50 bar · 45℃ 액체');
    s+=P('M269,190 C269,170 300,160 300,150 L300,130',c.liq,3)+B(262,100,70,30,'주기관 ×1','LGIP · FBIV 500~600 bar');
    s+=T(8,240,'되돌린다: 끓음은 응축기에서 액체로 · 연료는 액체째 펌프로 — 압축기 없음 {典 31}');
  } else if(type==='box'){
    s+=B(8,96,74,44,'연료탱크 18,600 m³','멤브레인 · 거주구 아래')+P('M82,108 L120,84',c.v)+B(120,66,80,34,'저압 압축기','자연 증발분 · 점선',true)+P('M82,126 L120,150',c.liq,1.5,true)+B(120,134,80,34,'펌프 + 강제기화기','모자란 몫 · 주역')+P('M200,83 L262,105',c.lp,2)+P('M200,151 L262,129',c.lp,3)+B(262,100,70,34,'주기관 ×1','X-DF 12기통 · 6~16 bar')+P('M296,100 L296,72',c.lp,1.5)+B(262,40,70,30,'발전기 ×4','냉동 컨테이너의 전기')+P('M200,74 C230,40 250,30 262,26',c.v,1.2)+B(262,8,70,28,'GCU','정박 때만')+T(8,240,'다스린다: 끓음 ≪ 갈증 — 압력은 관리하고 대부분은 억지로 끓인다');
  } else {
    s+=B(8,90,76,50,'Type C 화물창 ×2','1.7 bara → 참는다')+P('M84,100 C110,60 130,50 150,46',c.v,1.2,true)+B(150,30,74,30,'벤트 마스트','참다 못하면 · 최후')+P('M84,115 L150,115',c.liq,3)+B(150,98,74,34,'카고 펌프 → STS 매니폴드','−160℃ 호스')+P('M224,115 L262,115',c.liq,3)+B(262,98,70,34,'받는 배','예컨대 무 · 3번에 찬다')+P('M46,140 C46,190 100,200 120,200',c.liq,1.5)+B(120,184,74,32,'연료 기화기','자기 화물로')+P('M194,200 L262,200',c.lp,2)+B(262,184,70,32,'DF 발전기 ×2','→ 전기추진')+T(8,240,'참는다: 재액화도 압축기도 없다 — 압력용기가 시간을 벌고, 그 안에 팔고 떠난다');
  }
  return s+'</svg>';
}

/* ── 독 구성 ── */
$('#edition').textContent=META.edition;
SHIPS.forEach(s=>{ const b=document.createElement('button'); const ready=!!HULLTYPE[s.id]; b.className='shipbtn'+(ready?'':' wait'); b.dataset.ship=s.id;
  b.innerHTML='<i></i>'+s.ho+' <small>'+s.name.split(' — ')[0]+(ready?'':' · 3D 대기')+'</small>';
  if(ready) b.onclick=()=>switchShip(s.id);
  $('#fleet').appendChild(b); });
function switchShip(id){ if(curShip===id) return; const prev=curType; curShip=id; curType=HULLTYPE[id]; TUNE=TUNES[curType]; TUNE_DEF=TUNE_DEFS[curType];
  if(prev!==curType){ buildShip(); resetCamera(); applyState(false); } else applyState(true);
  if(panel.classList.contains('show')) fillPanel(); touch(); }
$('#t-lock').onclick=()=>{ showLock=!showLock; applyState(false); };
buildShip();
SYSTEMS.forEach(sy=>{ const b=document.createElement('button'); b.dataset.sys=sy.id; const n=PARTS.filter(p=>p.userData.sys===sy.id).length;
  b.innerHTML='<i></i>'+sy.num+' '+sy.en+' <span class="cnt">'+(n||'—')+'</span>';
  b.onclick=()=>{ curSys=(curSys===sy.id)?null:sy.id; applyState(false); if(curSys){ const first=PARTS.find(p=>p.userData.sys===curSys && p.visible); lastPart=first?first.userData:{sys:curSys, name:sy.en+' · '+sy.ko, note:''}; openPanel('part'); } touch(); };
  $('#legend').appendChild(b); });
$('#t-tune').onclick=()=>openPanel('tune');
placeCamera(); applyLivery(); applyState(false);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>applyLivery());
(function loop(){ requestAnimationFrame(loop); renderer.render(scene,camera); updateLabels(); })();
